name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v -o bin/pipedact cmd/pipedact/main.go

      - name: Verify CLI commands
        run: |
          ./bin/pipedact --help
          ./bin/pipedact principles
          ./bin/pipedact validate-sin 046-454-286
